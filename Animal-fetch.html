<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Explorer API</title>
    <style>
        /* CSS Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 { color: #2c3e50; margin-bottom: 30px; }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        input {
            padding: 15px;
            width: 60%;
            border: 2px solid #ddd;
            border-radius: 8px 0 0 8px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus { border-color: #27ae60; }

        button {
            padding: 15px 25px;
            border: none;
            background-color: #27ae60;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 8px 8px 0;
            transition: background 0.3s;
        }

        button:hover { background-color: #219150; }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .animal-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: left;
            border-top: 5px solid #27ae60;
        }

        .animal-card h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            text-transform: capitalize;
        }

        .animal-card p {
            font-size: 14px;
            color: #555;
            margin: 8px 0;
            line-height: 1.4;
        }

        .animal-card strong { color: #333; }

        .error { color: #e74c3c; font-weight: bold; }
        
        .loading { font-style: italic; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐾 Animal Explorer</h1>
        
        <div class="search-box">
            <input type="text" id="animalInput" placeholder="Type an animal (e.g. Fox, Shark, Owl)...">
            <button id="searchBtn">Find Animal</button>
        </div>

        <div id="resultContainer" class="result-grid">
            <!-- Results will appear here -->
        </div>
    </div>

    <script>
        // JavaScript Logic
        const apiKey = 'YOUR_API_KEY_HERE'; // <--- PASTE YOUR API KEY HERE
        const searchBtn = document.getElementById('searchBtn');
        const animalInput = document.getElementById('animalInput');
        const resultContainer = document.getElementById('resultContainer');

        async function fetchAnimal() {
            const animalName = animalInput.value.trim();
            
            if (!animalName) {
                alert("Please enter an animal name first.");
                return;
            }

            // Show loading state
            resultContainer.innerHTML = '<p class="loading">Searching the wilderness...</p>';

            try {
                const response = await fetch(`https://api-ninjas.com{animalName}`, {
                    method: 'GET',
                    headers: {
                        'X-Api-Key': apiKey,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                resultContainer.innerHTML = '<p class="error">Failed to fetch data. Check your API key or connection.</p>';
            }
        }

        function displayResults(animals) {
            resultContainer.innerHTML = "";

            if (animals.length === 0) {
                resultContainer.innerHTML = '<p>No animals found by that name. Try something else!</p>';
                return;
            }

            animals.forEach(animal => {
                const card = document.createElement('div');
                card.className = 'animal-card';
                
                // Construct card HTML safely
                card.innerHTML = `
                    <h3>${animal.name}</h3>
                    <p><strong>Scientific Name:</strong> ${animal.taxonomy.scientific_name || 'N/A'}</p>
                    <p><strong>Location:</strong> ${animal.locations ? animal.locations.join(', ') : 'Unknown'}</p>
                    <p><strong>Diet:</strong> ${animal.characteristics.diet || 'N/A'}</p>
                    <p><strong>Habitat:</strong> ${animal.characteristics.habitat || 'N/A'}</p>
                    <p><strong>Top Speed:</strong> ${animal.characteristics.top_speed || 'Unknown'}</p>
                `;
                resultContainer.appendChild(card);
            });
        }

        // Event Listeners
        searchBtn.addEventListener('click', fetchAnimal);

        animalInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchAnimal();
            }
        });
    </script>
</body>
</html>
